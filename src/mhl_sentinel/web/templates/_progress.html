<div id="progress"
     hx-get="/fragments/projects/{{ p.id }}/progress" hx-swap="outerHTML"
     hx-trigger="sse:job.progress throttle:2s, sse:job.started, sse:job.finished, sse:job.failed">
  {% if job %}
    {% if job_running %}
    <p class="hint job-line">{{ job_label }} this project · {{ job.files_done }} of {{ job.files_total }} files
      · {{ job.bytes_done|size }} of {{ job.bytes_total|size }}</p>
    <progress value="{{ job_pct or 0 }}" max="100">{{ job_pct or 0 }}%</progress>
    {% else %}
    <p class="hint job-line">{{ job_label }} this project: waiting for working hours to end.</p>
    {% endif %}
  {% endif %}
</div>
