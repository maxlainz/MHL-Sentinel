[project]
name = "mhl-sentinel"
version = "0.7.1"
description = "ASC MHL integrity sentinel for a NAS archive of finished projects"
readme = "README.md"
license = "MIT"
authors = [{ name = "Max Lainz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  # D1 / norma conformidad-mhl.md: la referencia es el oráculo; subir versión es decisión del owner.
  "ascmhl==1.2",
  "click>=8.1.8",
  "fastapi>=0.142.2",
  "jinja2>=3.1.6",
  "pathspec>=1.1.1",
  "pydantic-settings>=2.15.0",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "sse-starlette>=3.5.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mhl-sentinel = "mhl_sentinel.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "lxml-stubs>=0.5",
  "types-pyyaml>=6.0.12.20260906",
  "httpx>=0.28.1",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhl_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
[[tool.mypy.overrides]]
module = ["ascmhl.*", "xxhash.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # ascmhl 1.2 usa 'gitwildmatch' (deprecado en pathspec); no es nuestro código
  "ignore:GitWildMatchPattern:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["mhl_sentinel"]
branch = true

[tool.coverage.report]
# D66: every line and branch of src/ runs in some test; a new path needs its test in the same PR.
fail_under = 100
show_missing = true
skip_covered = true
